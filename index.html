<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07140f">
<meta name="description" content="Organiza tu amigo invisible a distancia con un solo enlace.">
<title>Amigo Invisible</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600;1,9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">

</head>
<body>
<div class="sky" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <path d="M0 100 C 300 60, 520 125, 860 92 S 1280 70, 1440 98 V130 H0Z" fill="rgba(255,255,255,.07)"/>
</svg>
<ul class="lights" id="lights" aria-hidden="true"></ul>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap" id="app"><div class="spinner" role="status" aria-label="Cargando"></div></main>
<div class="toast" id="toast" role="status" hidden></div>
